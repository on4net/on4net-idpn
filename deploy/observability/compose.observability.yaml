# Local observability stack for on4net IDPN (docs/monitoring.md).
#
#   Copy-Item .env.example .env      # then set GRAFANA_ADMIN_PASSWORD
#   docker compose --env-file .env -f compose.observability.yaml config --quiet
#   docker compose --env-file .env -f compose.observability.yaml up -d
#
# The API must already run on the host with METRICS_ENABLED=true (compose.yaml provides
# PostgreSQL/Redis/Mailhog only). Prometheus reaches it through host.docker.internal, so the
# API keeps binding 127.0.0.1.
#
# This stack is additive: it does not publish, replace or share the development volumes.
name: idpn-observability

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: idpn-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.5.2
    container_name: idpn-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3003}:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - observability

  loki:
    image: grafana/loki:3.4.2
    container_name: idpn-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - '127.0.0.1:${LOKI_PORT:-3100}:3100'
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - observability

  # Disk alerts need a node exporter. The host root mount works on Linux; Docker Desktop
  # cannot expose the Windows filesystem this way, so the service is opt-in:
  #   docker compose --env-file .env -f compose.observability.yaml --profile node-exporter up -d
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: idpn-node-exporter
    restart: unless-stopped
    profiles: ['node-exporter']
    command: ['--path.rootfs=/host']
    pid: host
    ports:
      - '127.0.0.1:9100:9100'
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - observability

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  observability:
    driver: bridge
