# Shared staging dependency stack (`docs/runbooks/app-onboarding.md` section 5).
#
# This file is deliberately separate from ../compose.yaml so staging can never share the
# development volumes, ports, credentials or network. It provisions only the stateful backing
# services; the API and the web bundles are deployed from the platform pipeline with
# `deploy/staging/.env.staging.example` as the variable contract.
#
#   cp deploy/staging/.env.staging.example deploy/staging/.env.staging   # then fill real values
#   docker compose --env-file deploy/staging/.env.staging \
#     -f deploy/staging/compose.staging.yaml up -d
#
# Isolation from production:
#   - own Docker project name, volumes and bridge network (nothing is shared by name);
#   - own PostgreSQL cluster/credentials and Redis password;
#   - own mail sink and SMTP credentials (never production SMTP);
#   - the API deployment uses its own SESSION_SECRET, SOCIAL_SECRET_KEY, MFA_SECRET_KEY and
#     signing key, so a staging token, cookie or provider secret is invalid in production.
# Every value comes from the environment: this file contains no secret.

name: idpn-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: idpn-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:?set STAGING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?set STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:?set STAGING_POSTGRES_DB}
    ports:
      - '127.0.0.1:${STAGING_POSTGRES_PORT:-55441}:5432'
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - staging

  redis:
    image: redis:7-alpine
    container_name: idpn-staging-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:?set STAGING_REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${STAGING_REDIS_PASSWORD:?set STAGING_REDIS_PASSWORD}
    ports:
      - '127.0.0.1:${STAGING_REDIS_PORT:-56379}:6379'
    volumes:
      - staging-redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - staging

  # Mail sink for a staging environment without real recipients. Point `SMTP_URL` of the
  # staging API at a real relay when invite delivery itself has to be verified end to end.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: idpn-staging-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${STAGING_MAIL_SMTP_PORT:-1126}:1025'
      - '127.0.0.1:${STAGING_MAIL_HTTP_PORT:-8126}:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8025/api/v1/info || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - staging

volumes:
  staging-postgres-data:
    name: idpn-staging-postgres-data
  staging-redis-data:
    name: idpn-staging-redis-data

networks:
  staging:
    name: idpn-staging
    driver: bridge
